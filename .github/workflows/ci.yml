name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
jobs:
  gates:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.4"
      - name: Isolate test state
        shell: pwsh
        run: |
          $scratch = Join-Path $env:GITHUB_WORKSPACE 'build/ci-temp'
          New-Item -ItemType Directory -Path $scratch -Force | Out-Null
          "TEMP=$scratch" >> $env:GITHUB_ENV
          "TMP=$scratch" >> $env:GITHUB_ENV
          "STOCK_ADVISOR_CONFIG=$scratch/config.json" >> $env:GITHUB_ENV
      - name: Install hash-locked test environment
        run: |
          python -m pip install --isolated --no-cache-dir --require-hashes --only-binary=:all: -r requirements/dev-windows.lock
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip check
      - name: Authoritative strict gates
        # Includes format, lint, type, product/loop tests, coverage and self-test.
        run: python loop/scripts/run_gates.py --strict
  package:
    needs: gates
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.4"
      - name: Build and verify isolated portable delivery
        run: python -B scripts/package_app.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-delivery
          path: dist/
          if-no-files-found: error
          retention-days: 7
  consumer:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      # Fresh runner: no checkout or developer Qt installation.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-delivery
          path: delivery/独立运行 空格路径
      - name: Verify hashes and run copied application
        shell: pwsh
        run: |
          $root = (Resolve-Path -LiteralPath 'delivery/独立运行 空格路径').Path
          $manifest = Get-Content -LiteralPath (Join-Path $root 'RELEASE_MANIFEST.json') -Raw | ConvertFrom-Json
          if ($manifest.source.commit -ne '${{ github.sha }}') { throw 'Unexpected source commit' }
          $files = @(Get-ChildItem -LiteralPath $root -File -Recurse | Where-Object Name -ne 'RELEASE_MANIFEST.json')
          if ($files.Count -ne $manifest.artifacts.files.Count) { throw 'Unexpected delivery file count' }
          foreach ($entry in $manifest.artifacts.files) {
            $path = [IO.Path]::GetFullPath((Join-Path $root $entry.path))
            if (-not $path.StartsWith($root + [IO.Path]::DirectorySeparatorChar)) { throw 'Path outside delivery' }
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry.sha256) { throw "Hash mismatch: $($entry.path)" }
          }
          $profile = Join-Path $env:RUNNER_TEMP 'stock-advisor-consumer'
          New-Item -ItemType Directory -Path $profile | Out-Null
          Get-ChildItem Env: | Where-Object Name -Match '^(PYTHON|QT_|QML)' | Remove-Item
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          $env:STOCK_ADVISOR_CONFIG = Join-Path $profile 'config.json'
          $env:TEMP = $profile
          $env:TMP = $profile
          $exe = Join-Path $root '股市锦囊/股市锦囊.exe'
          foreach ($flag in @('--self-test','--smoke-test')) {
            $out = Join-Path $profile 'stdout.txt'
            $err = Join-Path $profile 'stderr.txt'
            $process = Start-Process -FilePath $exe -ArgumentList $flag -WorkingDirectory $profile -WindowStyle Hidden -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
            if (-not $process.WaitForExit(45000)) { $process.Kill(); throw 'Consumer startup timeout' }
            $marker = if ($flag -eq '--self-test') { 'SELF_TEST_OK' } else { 'GUI_SMOKE_OK' }
            if ($process.ExitCode -ne 0 -or (Get-Content -LiteralPath $out -Raw) -notmatch $marker -or (Get-Item -LiteralPath $err).Length) { throw "Consumer failed: $flag" }
            Get-Content -LiteralPath $out
          }
