name: CI

# Dev-toolchain CI for the loop control plane + product (ADR-0008 / WS-8). There is no git remote
# yet; this workflow activates the moment the repository is pushed to GitHub. It runs on
# windows-latest because the product GUI is Tkinter (runs headless on Windows without xvfb) and
# Windows is the shipping target.
#
# Everything here is enforced. The whole-repo ruff + pyright steps were informational
# (continue-on-error) while the product-code adoption debt was outstanding; that debt is cleared
# (loop/quality/TOOLCHAIN_BASELINE.md), so G-FORMAT/G-LINT/G-TYPE/G-COVERAGE are now enabled gates
# and `run_gates.py` runs them for real — no continue-on-error anywhere.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dev toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev

      # --- Enforced: the control-plane Python is held clean ---
      - name: Ruff format (control plane)
        run: python -m ruff format --check loop/scripts loop/tests
      - name: Ruff lint (control plane)
        run: python -m ruff check loop/scripts loop/tests

      # --- Enforced: tests (unittest is the authoritative runner) + self-test ---
      - name: Product tests
        run: python -m unittest discover -s tests
      - name: Loop tests
        run: python -m unittest discover -s loop/tests
      - name: Self-test
        run: python main.py --self-test

      # --- Enforced: the loop quality gates. G-FORMAT/G-LINT/G-TYPE run whole-repo ruff+pyright and
      # G-COVERAGE asserts each coverage dimension against quality/convergence.json, so the former
      # informational steps and the blended `coverage report --fail-under=85` are covered here. That
      # flag only floored coverage.py's combined statement+branch total and asserted none of the four
      # documented thresholds; check_coverage.py replaces it.
      - name: Loop quality gates
        run: python loop/scripts/run_gates.py
