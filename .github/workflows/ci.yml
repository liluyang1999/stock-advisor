name: CI

# Dev-toolchain CI for the loop control plane + product (ADR-0008 / WS-8). There is no git remote
# yet; this workflow activates the moment the repository is pushed to GitHub. It runs on
# windows-latest because the product GUI is Tkinter (runs headless on Windows without xvfb) and
# Windows is the shipping target. The steps that would fail only on the *product-code adoption debt*
# (whole-repo ruff + pyright — see loop/quality/TOOLCHAIN_BASELINE.md) are informational
# (continue-on-error) until that debt is cleared in the product-code phase; everything else is
# enforced.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dev toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev

      # --- Enforced: the control-plane Python is held clean ---
      - name: Ruff format (control plane)
        run: python -m ruff format --check loop/scripts loop/tests
      - name: Ruff lint (control plane)
        run: python -m ruff check loop/scripts loop/tests

      # --- Enforced: tests (unittest is the authoritative runner), self-test, coverage floor ---
      - name: Product tests (449)
        run: python -m unittest discover -s tests
      - name: Loop tests
        run: python -m unittest discover -s loop/tests
      - name: Self-test
        run: python main.py --self-test
      - name: Coverage (>=85% branch floor)
        run: |
          python -m coverage run -m unittest discover -s tests
          python -m coverage report --fail-under=85

      # --- Enforced: the loop quality gates (dev phase: G-LOOP + G-CORE) ---
      - name: Loop quality gates
        run: python loop/scripts/run_gates.py

      # --- Informational: whole-repo ruff + pyright surface the product adoption debt ---
      - name: Ruff format (whole repo, informational)
        continue-on-error: true
        run: python -m ruff format --check .
      - name: Ruff lint (whole repo, informational)
        continue-on-error: true
        run: python -m ruff check .
      - name: Pyright (informational)
        continue-on-error: true
        run: python -m pyright
