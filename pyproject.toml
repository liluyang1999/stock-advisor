# Project + dev-toolchain configuration for stock-advisor (股市锦囊).
#
# ADR-0008 (loop/decisions/0008-dev-toolchain.md): ruff + pyright + pytest + coverage + pre-commit,
# development-only (never shipped in the PyInstaller EXE). This file is the single home for the
# ruff / pyright / pytest / coverage configuration; pre-commit (.pre-commit-config.yaml) and CI
# (.github/workflows/ci.yml) require their own files by necessity.
#
# There is no [build-system]: the app is not installed from source — it runs via `python main.py`
# and ships as a PyInstaller EXE. Tests, gates, and self-test run under the repo's Python; developers may use `.venv/`.
# Packaging creates its own disposable environment under build/ and never reuses it.

[project]
name = "stock-advisor"
# 版本号的唯一权威字段是 src/version.py::__version__，两段式 MAJOR.MINOR
# （loop/governance/VERSION_AND_CHANGE_CONTROL.md）。这里用 PEP 621 的 dynamic 声明"版本不静态写在
# 本文件里"，而不是再抄一份字面量——抄一份就必然有一天对不上。
#
# 为什么真源在包里而不是这里：本项目没有 [build-system]，从不被 pip 安装，也就没有 dist-info，
# `importlib.metadata.version("stock-advisor")` 在开发期和冻结后的 EXE 里都取不到值。运行期唯一
# 取得到的版本号只能来自被 import 的模块，所以真源必须是模块，pyproject 只能引用它。
dynamic = ["version"]
description = "股市锦囊 — an offline, rule-based A-share desktop decision-support tool."
requires-python = ">=3.14"
# WI-023 completed the ADR-0001 migration: PySide6 is the shipping GUI, so it is a real runtime
# dependency — `python main.py` cannot start without it. The domain core stays pure stdlib and is
# machine-held that way by G-CORE (no PySide6/urllib import in the 13 core modules), so Qt is
# required by the application, not by the model. See the LICENCE note on the gui group below.
dependencies = [
    "PySide6-Essentials==6.12.0",   # LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only; pulls shiboken6==6.12.0 (same)
]

[dependency-groups]
# Development-only tools (PEP 735). Install with:  python -m pip install --group dev
# Pinned to the versions validated on 2026-07-13 (Python 3.14.4, Windows 11).
dev = [
    "ruff==0.15.21",
    "pyright==1.1.410",
    "pytest==9.1.1",
    "coverage[toml]==7.15.1",
    "pre-commit==4.6.0",
]

# 构建期唯一依赖。精确钉版与 dev/gui 一致：交付物的可复现性取决于它，浮动版本会让"同一提交构建出
# 不同产物"成为可能。此前它单独放在 requirements-build.txt 里且写作 `pyinstaller>=6.15`——既没钉住，
# 又是第三套依赖声明机制。安装：python -m pip install --group build
build = [
    "pyinstaller==6.21.0",          # 与 RELEASE_MANIFEST 里记录的构建工具链版本一致
]

# Qt test tooling (dev-only). Install with:  python -m pip install --group gui
# PySide6-Essentials itself now lives in [project].dependencies (WI-023 made Qt the shipping GUI);
# it is repeated here only so `pip install --group gui` still provisions a complete Qt test
# environment in one command, and the pin must stay identical to the runtime pin above.
# Pinned to the versions validated on 2026-07-16 (Python 3.14.4, Windows 11); PySide6 ships
# cp310-abi3 wheels, so the stable ABI covers 3.14.
#
# PySide6-Essentials, NOT PySide6 — measured, not assumed. The `PySide6` meta-package is
# Essentials + Addons: 634.1 MB installed, of which Qt6WebEngineCore.dll alone is 195.3 MB.
# Essentials (202.2 MB) carries everything this product needs — QtCore/QtGui/QtWidgets, and with
# them QMainWindow, QTableView, QAbstractTableModel, QSortFilterProxyModel (REQ-012), QThread and
# QTimer (REQ-013). Addons carries only things it does not: QtWebEngine, Qt3D, QtMultimedia, and
# QtCharts — the K-line is drawn with QPainter over the pure geometry in domain/chart.py (WI-027),
# so QtCharts buys nothing for +432.9 MB. Verified by installing Essentials alone and constructing
# every widget/class above. Revisit only if a real need for an Addons module appears.
#
# LICENCE (WI-003 / WI-025 / AC-009): PySide6-Essentials and shiboken6 are
# `LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only` — the only non-PSF licence in the product.
# We distribute under the LGPL option, which obliges us to ship the licence text, state that Qt is
# used under LGPL, and let a user relink against their own Qt build. ADR-0004 is now accepted as
# onedir precisely so that last obligation is dischargeable: the Qt DLLs sit as replaceable files
# beside the EXE. The shipped artifacts (dist/licenses/, THIRD_PARTY_NOTICES.md, SBOM.json) are
# generated by make_release_manifest.py. pytest-qt is MIT.
gui = [
    "PySide6-Essentials==6.12.0",   # LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only; pulls shiboken6==6.12.0 (same)
    "pytest-qt==4.5.0",             # MIT; dev-only, never shipped
]

# --------------------------------------------------------------------------- ruff (format + lint)
[tool.ruff]
line-length = 100          # codebase leans long (462 lines >100, 163 >120); 100 balances future churn
target-version = "py314"
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear. E501 (line-too-long) is delegated to
# the formatter, which owns wrapping. Product code is lint-clean; the only intentional carve-outs are
# the main.py bootstrap import (per-line noqa) and the tests' sys.path-bootstrap imports (below).
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Test modules insert src/ on sys.path before importing the package (required for `unittest
# discover`), so their module-level imports legitimately follow that bootstrap.
"tests/**" = ["E402"]

[tool.ruff.lint.isort]
combine-as-imports = true          # merge `import x as y` onto one statement, not one-per-line

[tool.ruff.format]
# ruff format defaults (black-compatible): double quotes, magic trailing comma, space indent.

# ------------------------------------------------------------------------- pyright (type, dev-only)
[tool.pyright]
include = ["src", "loop/scripts", "main.py", "scripts"]
exclude = ["**/__pycache__", "build", "dist", ".venv"]
# src: main.py inserts it on sys.path (layer packages import as `domain.*`/`qt_app.*`…);
# scripts: tests insert it to import build_exe / make_release_manifest.
extraPaths = ["src", "scripts"]
pythonVersion = "3.14"
pythonPlatform = "Windows"
typeCheckingMode = "basic" # not strict: product code is largely un-annotated today (ADR-0008)

# --------------------------------------------------------------------------- pytest (test runner)
[tool.pytest.ini_options]
# pytest is adopted as the test framework (ADR-0010); it runs the domain/data/service/loop suites
# natively. The Tk-lifecycle flakiness that originally kept the GUI suite off pytest went away with
# the suite itself (WI-023 deleted the Tkinter layer); `unittest discover` nonetheless stays the
# authoritative gate runner and coverage runs via unittest, because run_gates.py and CI are both
# written against it — see loop/quality/TOOLCHAIN_BASELINE.md. Qt tests need a platform plugin, so
# run them with QT_QPA_PLATFORM=offscreen (CI sets it job-wide).
testpaths = ["tests", "loop/tests"]
pythonpath = ["src", "."]              # resolve the src/ layer packages + loop/ helpers
addopts = "-q --import-mode=importlib" # importlib avoids sys.path basename collisions across the two trees

# --------------------------------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["src"]
branch = true
# 原有的 omit（*/ui/_app_members.py，ADR-0014 的类型基座）随 WI-023 删除 Tk 层时一并消失，
# 死配置已移除：omit 匹配不存在的文件虽无害，但会误导读者以为该文件仍在。

[tool.coverage.report]
show_missing = true
precision = 1
# Numeric thresholds (overall stmt >=90 / branch >=85; core stmt >=95 / branch >=90) live in
# loop/quality/convergence.json. Note: --fail-under compares coverage.py's *combined* statement+
# branch total, not the branch floor; it does not assert any of those four thresholds.
