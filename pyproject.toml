# Project + dev-toolchain configuration for stock-advisor (股市锦囊).
#
# ADR-0008 (loop/decisions/0008-dev-toolchain.md): ruff + pyright + pytest + coverage + pre-commit,
# development-only (never shipped in the PyInstaller EXE). This file is the single home for the
# ruff / pyright / pytest / coverage configuration; pre-commit (.pre-commit-config.yaml) and CI
# (.github/workflows/ci.yml) require their own files by necessity.
#
# There is no [build-system]: the app is not installed from source — it runs via `python main.py`
# and ships as a PyInstaller EXE. Tests, gates, and self-test run under the repo's Python; `.venv/`
# is only a PyInstaller build sandbox.

[project]
name = "stock-advisor"
version = "1.0.0"                     # mirrors src/stock_advisor/__init__.py::__version__
description = "股市锦囊 — an offline, rule-based A-share desktop decision-support tool."
requires-python = ">=3.14"
# No runtime dependencies yet: the domain core is pure stdlib and the shipping GUI is still Tkinter
# (stdlib). The ADR-0001 migration is under way behind the [dependency-groups].gui group below;
# PySide6-Essentials moves here when the Qt GUI becomes the shipping one.

[dependency-groups]
# Development-only tools (PEP 735). Install with:  python -m pip install --group dev
# Pinned to the versions validated on 2026-07-13 (Python 3.14.4, Windows 11).
dev = [
    "ruff==0.15.21",
    "pyright==1.1.410",
    "pytest==9.1.1",
    "coverage[toml]==7.15.1",
    "pre-commit==4.6.0",
]

# The ADR-0001 Tkinter→PySide6 migration (WI-003). Install with:  python -m pip install --group gui
# Pinned to the versions validated on 2026-07-16 (Python 3.14.4, Windows 11); PySide6 ships
# cp310-abi3 wheels, so the stable ABI covers 3.14.
#
# PySide6-Essentials, NOT PySide6 — measured, not assumed. The `PySide6` meta-package is
# Essentials + Addons: 634.1 MB installed, of which Qt6WebEngineCore.dll alone is 195.3 MB.
# Essentials (202.2 MB) carries everything this product needs — QtCore/QtGui/QtWidgets, and with
# them QMainWindow, QTableView, QAbstractTableModel, QSortFilterProxyModel (REQ-012), QThread and
# QTimer (REQ-013). Addons carries only things it does not: QtWebEngine, Qt3D, QtMultimedia, and
# QtCharts — the K-line is drawn with QPainter over the pure geometry in domain/chart.py (WI-027),
# so QtCharts buys nothing for +432.9 MB. Verified by installing Essentials alone and constructing
# every widget/class above. Revisit only if a real need for an Addons module appears.
#
# LICENCE (WI-003 / AC-009): PySide6-Essentials and shiboken6 are
# `LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only`. This is the first non-PSF licence in the
# product — today it ships stdlib-only. Distributing the EXE under the LGPL option obliges us to
# ship the licence text, state that Qt is used under LGPL, and let a user relink against their own
# Qt build. That last obligation interacts directly with the still-`proposed` ADR-0004 (PyInstaller
# onefile): onedir makes DLL replacement trivial, onefile does not. Do not ship a Qt build before
# ADR-0004 is decided with this in view. pytest-qt is MIT.
gui = [
    "PySide6-Essentials==6.11.1",   # LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only; pulls shiboken6==6.11.1 (same)
    "pytest-qt==4.5.0",             # MIT; dev-only, never shipped
]

# --------------------------------------------------------------------------- ruff (format + lint)
[tool.ruff]
line-length = 100          # codebase leans long (462 lines >100, 163 >120); 100 balances future churn
target-version = "py314"
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear. E501 (line-too-long) is delegated to
# the formatter, which owns wrapping. Product code is lint-clean; the only intentional carve-outs are
# the main.py bootstrap import (per-line noqa) and the tests' sys.path-bootstrap imports (below).
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Test modules insert src/ on sys.path before importing the package (required for `unittest
# discover`), so their module-level imports legitimately follow that bootstrap.
"tests/**" = ["E402"]

[tool.ruff.lint.isort]
combine-as-imports = true          # merge `import x as y` onto one statement, not one-per-line

[tool.ruff.format]
# ruff format defaults (black-compatible): double quotes, magic trailing comma, space indent.

# ------------------------------------------------------------------------- pyright (type, dev-only)
[tool.pyright]
include = ["src", "loop/scripts", "main.py", "build_exe.py"]
exclude = ["**/__pycache__", "build", "dist", ".venv"]
extraPaths = ["src"]       # main.py inserts src/ on sys.path; product imports are `stock_advisor.*`
pythonVersion = "3.14"
pythonPlatform = "Windows"
typeCheckingMode = "basic" # not strict: product code is largely un-annotated today (ADR-0008)

# --------------------------------------------------------------------------- pytest (test runner)
[tool.pytest.ini_options]
# pytest is adopted as the test framework (ADR-0010); it runs the domain/data/service/loop suites
# natively. The legacy Tkinter GUI suite (tests/test_gui_layout.py) has a pytest Tk-lifecycle flakiness
# on Windows/CPython 3.14, so `unittest discover` stays the authoritative gate runner and coverage runs
# via unittest — see loop/quality/TOOLCHAIN_BASELINE.md. Full GUI-suite migration is a tracked fast-follow.
testpaths = ["tests", "loop/tests"]
pythonpath = ["src", "."]              # resolve `stock_advisor.*` (src/ layout) + loop/ helpers
addopts = "-q --import-mode=importlib" # importlib avoids sys.path basename collisions across the two trees

# --------------------------------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    # 仅供 pyright 的类型基座（ADR-0014）：运行期从不被导入，310 条声明无一可执行，
    # 任何测试都不可能覆盖它。计入只会稀释真实数字（曾把总数从 86.8% 压到 82.7%）。
    "*/ui/_app_members.py",
]

[tool.coverage.report]
show_missing = true
precision = 1
# Numeric thresholds (overall stmt >=90 / branch >=85; core stmt >=95 / branch >=90) live in
# loop/quality/convergence.json. Note: --fail-under compares coverage.py's *combined* statement+
# branch total, not the branch floor; it does not assert any of those four thresholds.
